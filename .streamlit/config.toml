[theme]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 100
# Community Cloud deploys Git changes itself; avoid starting filesystem watcher
# threads during server bootstrap. This does not disable manual list refresh.
fileWatcherType = "none"
